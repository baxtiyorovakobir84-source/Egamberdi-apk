name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev
        pip install --upgrade pip
        pip install buildozer cython

    - name: Force SDK API 33 and Auto-Accept Licenses
      run: |
        mkdir -p ~/.android
        touch ~/.android/repositories.cfg
        if [ -f buildozer.spec ]; then
          sed -i 's/^#\? \?android.accept_sdk_license =.*/android.accept_sdk_license = True/' buildozer.spec
          sed -i 's/^#\? \?android.api =.*/android.api = 33/' buildozer.spec
          sed -i 's/^#\? \?android.minapi =.*/android.minapi = 21/' buildozer.spec
          sed -i 's/^#\? \?android.build_tools_version =.*/android.build_tools_version = 33.0.2/' buildozer.spec
        fi

    - name: Build APK with Buildozer
      run: |
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Egamberdi-APK
        path: bin/*.apk
